<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PISA Hub — Admin Login</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-card">
    <h1>PISA Hub Admin</h1>
    <p class="sub">Sign in with your username or email.</p>

    <p class="adm-notice admin-hidden" id="resetDone" role="status">Password updated. Sign in with your new password.</p>

    <form id="loginForm">
      <div class="admin-field">
        <label for="email">Username or email</label>
        <input type="text" id="email" required autocomplete="username" autocapitalize="none" spellcheck="false" />
      </div>
      <div class="admin-field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="admin-btn" id="loginBtn" style="width:100%;">Sign in</button>
      <p class="admin-error" id="loginError"></p>
      <p style="text-align:center; margin:14px 0 0;"><a href="#forgot" id="forgotLink" class="adm-link">Forgot password?</a></p>
    </form>

    <form id="forgotForm" class="admin-hidden" novalidate>
      <p class="sub" style="margin-top:-8px;">Enter your username or email and we'll send a link to your account's email address to set a new password.</p>
      <div class="admin-field">
        <label for="forgotEmail">Username or email</label>
        <input type="text" id="forgotEmail" required autocomplete="username" autocapitalize="none" spellcheck="false" />
      </div>
      <button type="submit" class="admin-btn" id="forgotBtn" style="width:100%;">Send reset link</button>
      <p class="admin-error" id="forgotError" role="alert"></p>
      <p class="adm-notice admin-hidden" id="forgotSent" role="status"></p>
      <p style="text-align:center; margin:14px 0 0;"><a href="#" id="backToLogin" class="adm-link">&larr; Back to sign in</a></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/admin/login.js"></script>
</body>
</html>
