<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PISA Hub — Set a new password</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-card">
    <h1>Set a new password</h1>

    <p class="sub" id="checking">Checking your reset link…</p>

    <div id="badLink" class="admin-hidden">
      <p class="sub" id="badLinkMsg">This reset link is invalid, expired, or has already been used.</p>
      <a class="admin-btn" href="/admin#forgot" style="width:100%; text-decoration:none;">Request a new link</a>
    </div>

    <form id="resetForm" class="admin-hidden" novalidate>
      <p class="sub">Choose a new password for your admin account.</p>
      <div class="admin-field">
        <label for="newPw">New password (at least 12 characters)</label>
        <input type="password" id="newPw" autocomplete="new-password" />
      </div>
      <div class="admin-field">
        <label for="confirmPw">Confirm new password</label>
        <input type="password" id="confirmPw" autocomplete="new-password" />
      </div>
      <button type="submit" class="admin-btn" id="saveBtn" style="width:100%;">Update password</button>
      <p class="admin-error" id="resetError" role="alert"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/admin/reset-password.js"></script>
</body>
</html>
